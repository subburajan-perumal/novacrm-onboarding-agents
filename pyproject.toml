[project]
name = "novacrm-onboarding-agents"
version = "0.1.0"
description = "Multi-agent customer onboarding automation for NovaCRM (Gmail -> voice tier confirmation -> Rocketlane -> Slack)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "twilio>=9.0",
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
]

[project.scripts]
novacrm = "novacrm.cli:main"

[dependency-groups]
dev = ["pytest>=8.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novacrm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real external APIs (needs .env); skipped by default"]
addopts = "-m 'not live'"
